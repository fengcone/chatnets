<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatnets</title>
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #333;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .stats {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .stat-item:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #666;
    }
    .stat-value {
      font-weight: 600;
      color: #333;
    }
    .connection-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 8px 0;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
    }
    .status-dot.connected {
      background: #34a853;
    }
    .status-dot.disconnected {
      background: #ea4335;
    }
    .status-dot.checking {
      background: #fbbc04;
    }
    .status-text {
      color: #666;
    }
    .save-directory {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #5f6368;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .save-directory-label {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:active {
      transform: scale(0.98);
    }
    button.secondary {
      background: #5f6368;
    }
    button.secondary:hover {
      background: #4a4d50;
    }
    .status {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }
    .status.success {
      background: #e6f4ea;
      color: #137333;
    }
    .status.info {
      background: #e8f0fe;
      color: #174ea6;
    }
    .status.error {
      background: #fce8e6;
      color: #c5221f;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
    .native-info {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>Chatnets</h2>

  <div class="section">
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">会话数</span>
        <span class="stat-value" id="session-count">-</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">消息数</span>
        <span class="stat-value" id="message-count">-</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">服务器状态</div>
    <div class="connection-status">
      <span class="status-indicator">
        <span class="status-dot" id="native-status-dot"></span>
        <span class="status-text" id="native-status-text">检查中...</span>
      </span>
      <button id="check-native" style="padding: 6px 12px; font-size: 12px;">检查</button>
    </div>
    <div id="save-directory-section" style="display: none;">
      <div class="save-directory-label">保存目录</div>
      <div class="save-directory" id="save-directory">-</div>
      <div class="native-info" id="platform-info"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">操作</div>
    <div class="actions">
      <button id="export-all">导出全部记录 (JSON)</button>
      <button id="refresh-stats" class="secondary">刷新统计</button>
      <button id="init-native" class="secondary">重新连接</button>
    </div>
  </div>

  <div id="action-status" class="status" style="display: none;"></div>

  <div class="footer">
    Chatnets v0.2.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
